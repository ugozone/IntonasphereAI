# Runs the pipeline self-test on Windows, macOS and Linux whenever the pipeline changes.
# Results: the "Actions" tab of the repository. A red cross means a platform broke.
name: Pipeline tests (Windows, macOS, Linux)

on:
  push:
    branches: [main]
    paths: ["pipeline/**", "app.py", "app_i18n.py", "ui_components.py", "messages/**", "tools/**", ".github/workflows/pipeline-tests.yml"]
  pull_request:
    paths: ["pipeline/**", "app.py", "app_i18n.py", "ui_components.py", "messages/**", "tools/**", ".github/workflows/pipeline-tests.yml"]
  workflow_dispatch:

jobs:
  selftest:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Token-selection rule
        run: python tests/test_selection.py
      - name: Translations complete (pipeline and app)
        run: |
          python tools/check_translations.py
          python ../tools/check_app_translations.py
      - name: Installer, in French, without questions
        run: python install.py --lang fr --yes --no-pip --no-selftest
      - name: Self-test in French (synthetic recordings, no network)
        run: python -m modules.selftest --folder test_data --skip-network --lang fr
      - name: Self-test in English (synthetic recordings, no network)
        run: python -m modules.selftest --folder test_data --skip-network --lang en
      - name: Help in both languages
        run: |
          python -m modules.run_all --help --lang fr
          python -m modules.run_all --help --lang en
      - name: Full run with a home-folder path (~) and the other commands
        shell: bash
        run: |
          cp -r test_data ~/it_test_data
          python -m modules.run_all --folder "~/it_test_data" --out "~/it_out" --align none
          python -m modules.run_all --folder "~/it_test_data" --out "~/it_out2" --align none --no-ftobi
          python -m modules.compare_runs --a "~/it_out" --b "~/it_out2"
          python -m modules.check_folder --folder "~/it_test_data"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-${{ matrix.os }}-py${{ matrix.python }}
          path: pipeline/outputs_selftest/selftest_report.txt
